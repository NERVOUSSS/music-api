<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 声屿音乐</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="brand" href="/music"><span class="brand-mark">S</span><span>声屿音乐</span></a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-head">
        <p class="eyebrow">YOUR MUSIC, YOUR SPACE</p>
        <h1 id="auth-title">欢迎回来</h1>
        <p id="auth-intro">登录后继续管理你的歌单和喜欢的音乐。</p>
      </div>
      <form id="auth-form" novalidate>
        <label id="display-name-field" hidden>
          显示名称
          <input id="display-name" autocomplete="name" maxlength="40" placeholder="例如：小王">
        </label>
        <label>
          用户名
          <input id="username" autocomplete="username" minlength="3" maxlength="32" required placeholder="请输入用户名（区分大小写）">
        </label>
        <label>
          密码
          <input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 位">
        </label>
        <p id="form-message" class="form-message" role="alert" hidden></p>
        <button id="auth-submit" class="submit-button" type="submit">登录</button>
      </form>
      <p class="mode-switch"><span id="mode-prefix">还没有账号？</span><button id="toggle-mode" type="button">注册账号</button></p>
    </section>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
